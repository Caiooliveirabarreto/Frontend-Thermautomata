<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-login">

    <div class="card-login">

        <div class="login-header">
            <h2>Entrar</h2>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <i data-lucide="x" class="icon-close"></i>
            </a>
        </div>

        <div class="login-tabs">
            <button class="tab active">Login</button>
            <button class="tab" onclick="window.location.href='cadastro.html'">Registrar</button>
        </div>

        <form class="login-form" id="formLogin">

            <div class="mb-4">
                <label class="form-label">E-mail</label>

                <div class="input-group-custom">
                    <i data-lucide="mail" class="input-icon"></i>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <div class="input-group-custom senha-container">

                    <i data-lucide="lock" class="input-icon"></i>

                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        placeholder="••••••••"
                        required>

                    <button
                        type="button"
                        class="btn-mostrar-senha"
                        id="btnMostrarSenha"
                        aria-label="Mostrar senha">

                        <i data-lucide="eye"></i>

                    </button>

                </div>
            </div>

            <button class="btn-login">
                Entrar
            </button>

        </form>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        const senha = document.getElementById("senha");
        const btnMostrarSenha = document.getElementById("btnMostrarSenha");

        btnMostrarSenha.addEventListener("click", function () {

            if (senha.type === "password") {

                senha.type = "text";

                btnMostrarSenha.innerHTML =
                    '<i data-lucide="eye-off"></i>';

                btnMostrarSenha.setAttribute(
                    "aria-label",
                    "Esconder senha"
                );

            } else {

                senha.type = "password";

                btnMostrarSenha.innerHTML =
                    '<i data-lucide="eye"></i>';

                btnMostrarSenha.setAttribute(
                    "aria-label",
                    "Mostrar senha"
                );
            }

            lucide.createIcons();
        });
        document.getElementById("formLogin").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {
                const resposta = await fetch("http://127.0.0.1:8000/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    mostrarNotificacao(resultado.detail, "erro");
                    return;
                }

                localStorage.setItem("token", resultado.token);

                mostrarNotificacao("Login realizado com sucesso!");

                window.location.href = "index.html";

            } catch (erro) {
                console.error("Erro:", erro);
                mostrarNotificacao(
                    "Não foi possível conectar com a API.",
                    "erro"
                );
            }
        });
    </script>
</body>

</html>

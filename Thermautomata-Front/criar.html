<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Criar Artigo</title>
</head>
<body>
    <header>
        <nav>
            <div class="row align-items-center">
                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>
                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="ps-5">SOBRE</a>
                    <a href="artigos.html" class="ps-5">ARTIGOS</a>
                    <a href="download.html" class="ps-5">DOWNLOAD</a>
                </div>
                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="desktop-nav-links ps-5">LOGIN</a>

                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu" aria-expanded="false"
                        aria-controls="mobileNavPanel">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
            <hr>
        </nav>
    </header>

    <!-- Overlay e painel do menu sanduíche -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="mobile-nav-panel" id="mobileNavPanel" role="dialog" aria-modal="true"
        aria-label="Menu de navegação">

        <button class="close-btn" id="closeNavBtn" aria-label="Fechar menu">&times;</button>

        <a href="index.html">Sobre</a>
        <a href="artigos.html">Artigos</a>
        <a href="download.html">Download</a>

        <button class="login-btn-mobile">Login</button>

    </div>

    <div class="container mt-5 mb-5">

        <form id="formCriarArtigo">

            <div class="mb-4">
                <label for="titulo" class="form-label fw-bold">Título</label>
                <input type="text" class="form-control campo" id="titulo" placeholder="Digite o título do artigo">
            </div>

            <div class="mb-5">
                <label for="artigo" class="form-label fw-bold">Artigo</label>
                <textarea class="form-control campo-texto" id="artigo" rows="10" placeholder="Digite o conteúdo do artigo"></textarea>
            </div>

            <h6 class="fw-bold mb-4">Referências</h6>

            <div id="referencias">

                <div class="referencia mb-3">

                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label">Nome</label>
                        <button type="button" class="btn-remover-referencia">
                            REMOVER
                        </button>
                    </div>

                    <input
                        type="text"
                        class="form-control campo nome-referencia"
                        placeholder="Digite o nome da referência"
                    >

                    <label class="form-label mt-3">Link</label>
                    <input
                        type="text"
                        class="form-control campo link-referencia"
                        placeholder="Digite o link da referência"
                    >

                </div>

            </div>

            <button type="button" class="btn-adicionar" id="btnAdicionarReferencia">
                <img src="assets/plus-large-svgrepo-com.svg" class="btn-criar-icon">
                <span>ADICIONAR</span>
            </button>

            <h6 class="fw-bold mb-4 mt-5">Tags</h6>

            <div id="listaTags" class="d-flex flex-wrap gap-2 mb-4">
                <p>Carregando tags...</p>
            </div>

            <div class="d-flex justify-content-end align-items-center">

                <button type="submit" class="btn btn-outline-dark">
                    Enviar
                </button>

            </div>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        const btnAdicionarReferencia = document.getElementById("btnAdicionarReferencia");
        const referencias = document.getElementById("referencias");

        btnAdicionarReferencia.addEventListener("click", function () {

            const novaReferencia = document.createElement("div");

            novaReferencia.classList.add("referencia", "mb-3");

            novaReferencia.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label">Nome</label>

                    <button type="button" class="btn-remover-referencia">
                        REMOVER
                    </button>
                </div>

                <input
                    type="text"
                    class="form-control campo nome-referencia"
                    placeholder="Digite o nome da referência"
                >

                <label class="form-label mt-3">Link</label>

                <input
                    type="text"
                    class="form-control campo link-referencia"
                    placeholder="Digite o link da referência"
                >
            `;

            novaReferencia
                .querySelector(".btn-remover-referencia")
                .addEventListener("click", function () {
                    novaReferencia.remove();
                });

            referencias.appendChild(novaReferencia);
        });
    </script>
    <script>
        document.getElementById("formCriarArtigo").addEventListener("submit", async function (event) {

            event.preventDefault();

            const token = localStorage.getItem("token");

            if (!token) {
                alert("Você precisa estar logado para criar um artigo.");
                window.location.href = "login.html";
                return;
            }

            const titulo = document.getElementById("titulo").value.trim();
            const artigo = document.getElementById("artigo").value.trim();

            const referencias = Array.from(
                document.querySelectorAll(".referencia")
            ).map(function (referencia) {

                return {
                    nome: referencia.querySelector(".nome-referencia").value.trim(),
                    link: referencia.querySelector(".link-referencia").value.trim()
                };

            });

            const tagsSelecionadas = Array.from(
                document.querySelectorAll(".tag-opcao.selecionada")
            ).map(function (tag) {
                return Number(tag.dataset.tagId);
            });

            if (!titulo || !artigo) {
                alert("Preencha o título e o artigo.");
                return;
            }

            if (referencias.length === 0) {
                alert("Adicione pelo menos uma referência.");
                return;
            }

            for (const referencia of referencias) {
                if (!referencia.nome || !referencia.link) {
                    alert("Preencha o nome e o link de todas as referências.");
                    return;
                }
            }

            if (tagsSelecionadas.length === 0) {
                alert("Selecione pelo menos uma tag.");
                return;
            }

            const dados = {
                titulo: titulo,
                artigo: artigo,
                fontes: referencias,
                tags: tagsSelecionadas
            };

            try {

                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/criar",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify(dados)
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(
                        resultado.detail || "Erro ao criar o artigo."
                    );
                    return;
                }

                alert("Artigo enviado com sucesso!");

                window.location.href = "artigos.html";

            } catch (erro) {

                console.error("Erro ao enviar artigo:", erro);

                alert("Não foi possível conectar com o servidor.");

            }

        });
    </script>
    <script>
        const listaTags = document.getElementById("listaTags");

        async function carregarTags() {
            try {
                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/tags"
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar tags");
                }

                const tags = await resposta.json();

                listaTags.innerHTML = "";

                tags.forEach(function (tag) {
                    const botao = document.createElement("button");

                    botao.type = "button";
                    botao.classList.add("tag-opcao");
                    botao.dataset.tagId = tag.idtag;
                    botao.textContent = tag.nome;

                    botao.addEventListener("click", function () {
                        botao.classList.toggle("selecionada");
                    });

                    listaTags.appendChild(botao);
                });

            } catch (erro) {
                console.error("Erro ao carregar tags:", erro);
                listaTags.innerHTML = "<p>Erro ao carregar as tags.</p>";
            }
        }

        carregarTags();
    </script>
    <script>
        document.querySelectorAll(".btn-remover-referencia").forEach(function (botao) {

            botao.addEventListener("click", function () {
                botao.closest(".referencia").remove();
            });

        });
    </script>

</body>
</html>

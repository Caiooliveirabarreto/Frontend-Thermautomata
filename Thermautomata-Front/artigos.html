<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Artigos</title>
</head>

<body>
    <header>
        <nav>
            <div class="row align-items-center">
                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>
                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="nav-link-custom">SOBRE</a>
                    <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
                    <a href="download.html" class="nav-link-custom">DOWNLOAD</a>
                </div>
                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="nav-link-custom">LOGIN</a>

                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu" aria-expanded="false"
                        aria-controls="mobileNavPanel">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
            <hr>
        </nav>
    </header>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <aside class="mobile-nav-panel" id="mobileNavPanel">
        <button
            class="close-btn"
            id="closeNavBtn"
            aria-label="Fechar menu"
        >
            &times;
        </button>

        <nav>
            <a href="index.html" class="nav-link-custom">SOBRE</a>
            <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
            <a href="download.html" class="nav-link-custom">DOWNLOAD</a>

            <a
                href="admin.html"
                class="nav-link-custom"
                id="mobileAdminLink"
                hidden
            >
                PAINEL
            </a>

            <a href="meus-artigos.html" class="nav-link-custom">
                MEUS ARTIGOS
            </a>

            <a href="login.html" class="login-btn-mobile" id="mobileAuthAction">
                LOGIN
            </a>
        </nav>
    </aside>

    
    <main class="artigos-layout">
        <aside class="sidebar-filtros">
            <button
                class="btn filtro-btn"
                data-bs-toggle="collapse"
                data-bs-target="#filtros"
                aria-expanded="true"
                aria-controls="filtros"
            >
                <span>Filtros</span>

                <div class="filtro-icones">
                    <ion-icon name="funnel-outline"></ion-icon>
                    <ion-icon class="chevron" name="chevron-down-outline"></ion-icon>
                </div>
            </button>

            <div class="collapse show filtros-conteudo" id="filtros">
                <div class="filtro-autor">
                    <label for="filtroAutor">Autor</label>
                    <input
                        type="text"
                        id="filtroAutor"
                        placeholder="Digite o nome do autor..."
                        autocomplete="off"
                    >
                </div>

                <ul class="lista-filtros" id="filtroTags">
                    <li data-tag-id="6">Política</li>
                    <li data-tag-id="7">Economia</li>
                    <li data-tag-id="8">Meio Ambiente</li>
                    <li data-tag-id="9">Tecnologia</li>
                    <li data-tag-id="10">Educação</li>
                    <li data-tag-id="11">Saúde</li>
                    <li data-tag-id="12">Urbanismo</li>
                    <li data-tag-id="13">Sustentabilidade</li>
                    <li data-tag-id="14">Sociedade</li>
                    <li data-tag-id="15">Infraestrutura</li>
                </ul>
            </div>
        </aside>

        <section class="artigos-lista" aria-label="Lista de artigos">
            <div id="listaArtigos"></div>
        </section>

        <div class="artigos-acoes">
            <button class="btn-criar" id="btnCriarArtigo">
                <img
                    src="assets/plus-large-svgrepo-com.svg"
                    class="btn-criar-icon"
                    alt=""
                >
                <span>Criar</span>
            </button>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>

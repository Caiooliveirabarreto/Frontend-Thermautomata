<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-login">

    <div class="card-login">

        <div class="login-header">
            <h2>Entrar</h2>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <i data-lucide="x" class="icon-close"></i>
            </a>
        </div>

        <div class="login-tabs">
            <button class="tab" onclick="window.location.href='login.html'">Login</button>
            <button class="tab active">Registrar</button>
        </div>

        <form class="login-form" id="formLogin" enctype="multipart/form-data">

            <label class="form-label">Foto de Perfil</label>

            <div class="profile-upload">

                <div class="profile-avatar">
                    <img src="back-end/uploads/perfis/template-perfil.jpg" alt="Perfil">
                </div>

                <input type="file" class="upload-btn" id="fotoPerfil">
    
            </div>

            <div class="mb-4">
                <label class="form-label">Nome de Exibição</label>

                <div class="input-group-custom">
                    <i data-lucide="user" class="input-icon"></i>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Como você quer ser chamado?" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">E-mail</label>

                <div class="input-group-custom">
                    <i data-lucide="mail" class="input-icon"></i>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <div class="input-group-custom">
                    <i data-lucide="lock" class="input-icon"></i>

                    <input
                        type="password"
                        id="senha"
                        class="form-control"
                        placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>

            <div class="terms-box">
                Ao criar uma conta, você concorda com nossos
                Termos de Uso e Política de Privacidade.
            </div>

            <button class="btn-login">
                Criar Conta
            </button>

        </form>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>

        lucide.createIcons();

        document.getElementById("formLogin").addEventListener("submit", async function (event) {

            event.preventDefault();

            const nome = document.querySelector('input[type="text"]').value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const foto = document.getElementById("fotoPerfil").files[0];
            const dados = new FormData();

            dados.append("nome", nome);
            dados.append("email", email);
            dados.append("senha", senha);

            if (foto) {
                dados.append("foto_perfil", foto);
            }

            try {

                const resposta = await fetch("http://127.0.0.1:8000/auth/cadastro", {
                    method: "POST",
                    body: dados
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.detail);
                    return;
                }

                localStorage.setItem("token", resultado.token);
                alert("Conta criada com sucesso!");
                window.location.href = "index.html";

            } catch (erro) {
                console.error("Erro:", erro);
                alert("Não foi possível conectar com a API.");
            }

        });

    </script>
    <script>
        const fotoPerfil = document.getElementById("fotoPerfil");
        const previewFoto = document.querySelector(".profile-avatar img");

        fotoPerfil.addEventListener("change", function () {

            const arquivo = fotoPerfil.files[0];

            if (!arquivo) {
                return;
            }

            previewFoto.src = URL.createObjectURL(arquivo);

        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <title>Administração</title>
</head>

<body>
    <header>
        <nav>

            <div class="row align-items-center">

                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="ps-5">SOBRE</a>
                    <a href="artigos.html" class="ps-5">ARTIGOS</a>
                    <a href="download.html" class="ps-5">DOWNLOAD</a>
                </div>

                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="desktop-nav-links ps-5">LOGIN</a>

                    <button class="hamburger-btn"
                        id="hamburgerBtn"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="mobileNavPanel">

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>

                </div>

            </div>

            <hr>

        </nav>
    </header>

    <!-- Overlay e painel do menu sanduíche -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="mobile-nav-panel"
        id="mobileNavPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Menu de navegação">

        <button class="close-btn"
            id="closeNavBtn"
            aria-label="Fechar menu">
            &times;
        </button>

        <a href="index.html">Sobre</a>
        <a href="artigos.html">Artigos</a>
        <a href="download.html">Download</a>
        <button class="login-btn-mobile">Login</button>
    </div>

    <!-- Conteúdo principal da página -->
    <main class="container mt-5">
        <div class="meus-artigos-cabecalho">
            <div>
                <h1>Meus artigos</h1>
                <p>
                    Acompanhe os artigos que você enviou.
                </p>
            </div>
        </div>

        <hr class="admin-divisor">

        <div id="listaMeusArtigos">
            <p>Carregando seus artigos...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script type="module"
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js">
    </script>
    <script nomodule
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js">
    </script>
    <script>
        async function carregarMeusArtigos() {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/meus",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar seus artigos");
                }

                const artigos = await resposta.json();
                const lista = document.getElementById("listaMeusArtigos");
                lista.innerHTML = "";

                if (artigos.length === 0) {
                    lista.innerHTML = `
                        <div class="lista-vazia">
                            Você ainda não possui artigos.
                        </div>
                    `;
                    return;
                }

                artigos.forEach(function (artigo) {
                    const elemento = document.createElement("div");

                    elemento.classList.add("meu-artigo");
                    let classeStatus = "";

                    if (artigo.status === "aprovado") {
                        classeStatus = "status-aprovado";
                    } else if (artigo.status === "pendente") {
                        classeStatus = "status-pendente";
                    } else if (artigo.status === "rejeitado") {
                        classeStatus = "status-rejeitado";
                    }

                    elemento.innerHTML = `
                        <div class="meu-artigo-conteudo">
                            <h2>${artigo.titulo}</h2>
                            <p class="meu-artigo-data">
                                Enviado em:
                                ${new Date(artigo.data_criacao).toLocaleDateString("pt-BR")}
                            </p>
                        </div>
                        <div class="meu-artigo-acoes">
                            <span class="status-artigo ${classeStatus}">
                                ${artigo.status}
                            </span>
                            <button
                                class="btn-visualizar"
                                onclick="visualizarMeuArtigo(${artigo.idart})">
                                VISUALIZAR
                            </button>
                        </div>
                    `;
                    lista.appendChild(elemento);
                });

            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById("listaMeusArtigos").innerHTML = `
                    <div class="lista-vazia">
                        Não foi possível carregar seus artigos.
                    </div>
                `;
            }

        }

        function visualizarMeuArtigo(idart) {
            window.location.href = `artigo.html?id=${idart}`;
        }
        carregarMeusArtigos();
    </script>

</body>

</html>

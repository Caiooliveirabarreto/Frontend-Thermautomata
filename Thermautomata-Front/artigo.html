<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <title>Artigo</title>
</head>

<body>

    <header>
        <nav>
            <div class="row align-items-center">
                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="nav-link-custom">SOBRE</a>
                    <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
                    <a href="download.html" class="nav-link-custom">DOWNLOAD</a>
                </div>

                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="nav-link-custom">LOGIN</a>

                    <button class="hamburger-btn" id="hamburgerBtn"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="mobileNavPanel">

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>
                </div>
            </div>
            <hr>
        </nav>
    </header>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <aside class="mobile-nav-panel" id="mobileNavPanel">
        <button
            class="close-btn"
            id="closeNavBtn"
            aria-label="Fechar menu"
        >
            &times;
        </button>

        <nav>
            <a href="index.html" class="nav-link-custom">SOBRE</a>
            <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
            <a href="download.html" class="nav-link-custom">DOWNLOAD</a>

            <a
                href="admin.html"
                class="nav-link-custom"
                id="mobileAdminLink"
                hidden
            >
                PAINEL
            </a>

            <a href="meus-artigos.html" class="nav-link-custom">
                MEUS ARTIGOS
            </a>

            <a href="login.html" class="login-btn-mobile" id="mobileAuthAction">
                LOGIN
            </a>
        </nav>
    </aside>

    <main class="container">
        <button class="btn-voltar-artigos" onclick="history.back()">
            ← Voltar
        </button>
        <div id="artigoCompleto"></div>
    </main>

    <script src="script.js"></script>
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const idArtigo = parametros.get("id");

        async function carregarArtigo() {
            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/${idArtigo}/detalhes`
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar artigo");
                }

                const artigo = await resposta.json();

                document.getElementById("artigoCompleto").innerHTML = `
                    <div class="cabecalho-artigo">
                        <div>
                            <h1>${artigo.titulo}</h1>
                            <h3>${artigo.nome_autor}</h3>
                            <p>${new Date(artigo.data_criacao).toLocaleDateString("pt-BR")}</p>
                        </div>

                        <button id="btnSalvar" class="btn-salvar">
                            <span class="estrela">☆</span>
                            <span class="texto-salvar">Salvar</span>
                        </button>
                    </div>

                    <div class="conteudo-artigo">
                        <p>${artigo.artigo}</p>
                    </div>

                    <div class="tags-artigo">
                        <h3>Tags</h3>

                        <div class="lista-tags-artigo">
                            ${
                                artigo.tags.map(function(tag) {
                                    return `<span class="tag-artigo">${tag.nome}</span>`;
                                }).join("")
                            }
                        </div>
                    </div>

                    <div class="fontes-artigo">
                        <h3>Referências</h3>

                        <div class="lista-fontes-artigo">
                            ${
                                artigo.fontes.map(function(fonte) {
                                    return `
                                        <div class="fonte-artigo">
                                            <strong>${fonte.nome}</strong>

                                            <a href="${fonte.link}" target="_blank">
                                                ${fonte.link}
                                            </a>
                                        </div>
                                    `;
                                }).join("")
                            }
                        </div>
                    </div>
                `;

                document.getElementById("btnSalvar").addEventListener("click", async function () {
                    try {
                        const token = localStorage.getItem("token");

                        if (!token) {
                            mostrarNotificacao(
                                "Você precisa estar logado para salvar um artigo.",
                                "aviso"
                            );
                            return;
                        }

                        const botao = document.getElementById("btnSalvar");

                        const estaSalvo = botao.querySelector(".estrela").textContent === "★";

                        const resposta = await fetch(
                            `http://127.0.0.1:8000/artigos/salvar/${idArtigo}`,
                            {
                                method: estaSalvo ? "DELETE" : "POST",
                                headers: {
                                    "Authorization": `Bearer ${token}`
                                }
                            }
                        );

                        const resultado = await resposta.json();

                        if (!resposta.ok) {
                            mostrarNotificacao(resultado.detail, "erro");
                            return;
                        }

                        if (estaSalvo) {
                            botao.innerHTML = `
                                <span class="estrela">☆</span>
                                <span class="texto-salvar">Salvar</span>
                            `;

                            mostrarNotificacao("Artigo removido dos salvos!");
                        } else {
                            botao.innerHTML = `
                                <span class="estrela">★</span>
                                <span class="texto-salvar"><strong>Salvo</strong></span>
                            `;

                            mostrarNotificacao("Artigo salvo com sucesso!");
                        }

                    } catch (erro) {
                        console.error("Erro ao alterar artigo salvo:", erro);
                    }
                });
                async function verificarSeEstaSalvo() {
                    const token = localStorage.getItem("token");

                    if (!token) {
                        return;
                    }

                    try {
                        const resposta = await fetch(
                            "http://127.0.0.1:8000/artigos/salvos",
                            {
                                headers: {
                                    "Authorization": `Bearer ${token}`
                                }
                            }
                        );

                        if (!resposta.ok) {
                            return;
                        }

                        const artigosSalvos = await resposta.json();

                        const estaSalvo = artigosSalvos.some(function (artigo) {
                            return artigo.idart === Number(idArtigo);
                        });

                        if (estaSalvo) {
                            document.getElementById("btnSalvar").innerHTML = `
                                <span class="estrela">★</span>
                                <span class="texto-salvar"><strong>Salvo</strong></span>
                            `;
                        }

                    } catch (erro) {
                        console.error("Erro ao verificar artigo salvo:", erro);
                    }
                }

                verificarSeEstaSalvo();

            } catch (erro) {
                console.error("Erro:", erro);
            }
        }

        carregarArtigo();
    </script>

</body>

</html>

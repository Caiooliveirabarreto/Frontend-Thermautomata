<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="assets/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <title>Perfil | Thermautomata</title>
    <script>
        try {
            if (localStorage.getItem("token")) {
                document.documentElement.classList.add("usuario-autenticando");
            }
        } catch (erro) {
            console.warn("Não foi possível verificar o token.");
        }
    </script>
</head>

<body>

    <header>
        <nav>
            <div class="row align-items-center">

                <div class="col-4">
                    <a href="index.html" aria-label="Página inicial">
                        <img
                            src="assets/images/logo.png"
                            alt="Logo"
                            class="img-fluid"
                        >
                    </a>
                </div>

                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="nav-link-custom">SOBRE</a>
                    <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
                    <a href="download.html" class="nav-link-custom">DOWNLOAD</a>
                </div>

                <div
                    class="col-2 align-items-end justify-content-end d-flex"
                    id="loginButtons"
                >
                    <a href="login.html" class="nav-link-custom">LOGIN</a>

                    <button
                        class="hamburger-btn"
                        id="hamburgerBtn"
                        type="button"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="mobileNavPanel"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>

            </div>

            <hr>
        </nav>
    </header>

    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <aside class="mobile-nav-panel" id="mobileNavPanel">

        <button
            class="close-btn"
            id="closeNavBtn"
            type="button"
            aria-label="Fechar menu"
        >
            &times;
        </button>

        <nav>
            <a href="index.html" class="nav-link-custom">SOBRE</a>
            <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
            <a href="download.html" class="nav-link-custom">DOWNLOAD</a>

            <a
                href="perfil.html"
                class="nav-link-custom"
                id="mobileProfileLink"
                hidden
            >
                MEU PERFIL
            </a>

            <a
                href="admin.html"
                class="nav-link-custom"
                id="mobileAdminLink"
                hidden
            >
                PAINEL
            </a>

            <a
                href="login.html"
                class="login-btn-mobile"
                id="mobileAuthAction"
            >
                LOGIN
            </a>
        </nav>

    </aside>

    <main class="container pagina-perfil">

        <section class="perfil-cabecalho">

            <div class="perfil-identidade">

                <img
                    src="${window.API_BASE}/uploads/perfis/template-perfil.jpg"
                    alt="Foto de perfil"
                    id="perfilFoto"
                    class="perfil-foto"
                >

                <div class="perfil-informacoes">

                    <span class="perfil-etiqueta">PERFIL</span>

                    <h1 id="perfilNome">Carregando...</h1>

                    <p id="perfilDescricao">
                        Carregando informações...
                    </p>

                </div>

            </div>

            <div class="perfil-estatistica">
                <strong id="perfilTotalArtigos">0</strong>
                <span>Artigos publicados</span>
            </div>

        </section>

        <section class="perfil-conteudo">

            <nav
                class="perfil-abas"
                id="perfilAbas"
                aria-label="Conteúdo do perfil"
                hidden
            >

                <button
                    type="button"
                    class="perfil-aba ativa"
                    data-aba="escritos"
                    aria-selected="true"
                >
                    Artigos escritos
                </button>

                <button
                    type="button"
                    class="perfil-aba"
                    data-aba="favoritos"
                    aria-selected="false"
                >
                    Favoritos
                </button>

            </nav>

            <div
                id="perfilMensagem"
                class="perfil-mensagem"
                role="status"
                aria-live="polite"
            >
                Carregando perfil...
            </div>

            <div
                id="listaPerfilArtigos"
                class="lista-perfil-artigos"
            ></div>

        </section>

    </main>

    <script src="assets/config.js"></script>
    <script src="assets/script.js"></script>

</body>
</html>

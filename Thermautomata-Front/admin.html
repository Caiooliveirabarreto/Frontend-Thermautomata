<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"

</head>

<body>

        <nav>

            <div class="row align-items-center">

                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                    <a href="index.html" class="ps-5">SOBRE</a>
                    <a href="artigos.html" class="ps-5">ARTIGOS</a>
                    <a href="download.html" class="ps-5">DOWNLOAD</a>
                </div>

                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="desktop-nav-links ps-5">LOGIN</a>

                    <button class="hamburger-btn"
                        id="hamburgerBtn"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="mobileNavPanel">

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>

                </div>

            </div>

            <hr>

        </nav>
    </header>

    <!-- Overlay e painel do menu sanduíche -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="mobile-nav-panel"
        id="mobileNavPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Menu de navegação">

        <button class="close-btn"
            id="closeNavBtn"
            aria-label="Fechar menu">
            &times;
        </button>

        <a href="index.html">Sobre</a>
        <a href="artigos.html">Artigos</a>
        <a href="download.html">Download</a>
        <button class="login-btn-mobile">Login</button>
    </div>

    <!-- Área administrativa -->
    <main class="container mt-5" id="areaAdmin">

        <div class="admin-cabecalho">

            <div>
                <h1>Painel administrativo</h1>
                <p>
                    Gerencie os artigos enviados pelos usuários.
                </p>
            </div>

            <div class="admin-contador">
                <span id="contadorPendentes">0</span>
                <small>pendentes</small>
            </div>

        </div>

        <hr class="admin-divisor">

        <section>
            <h2 class="titulo-pendentes">
                Artigos pendentes
            </h2>

            <div id="listaPendentes">
                <p>Carregando artigos...</p>
            </div>
        </section>

        <section class="mt-5">
            <h2 class="titulo-pendentes">Todos os artigos</h2>

            <div id="listaTodosArtigos">
                <p>Carregando artigos...</p>
            </div>
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script type="module"
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js">
    </script>
    <script nomodule
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js">
    </script>
    <script>
        async function verificarAdministrador() {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {

                const resposta = await fetch(
                    "http://127.0.0.1:8000/auth/me",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }

                const usuario = await resposta.json();

                if (usuario.tipo !== 1) {
                    window.location.href = "artigos.html";
                    return;
                }
                document.getElementById("areaAdmin").style.display = "block";

            } catch (erro) {
                console.error("Erro ao verificar administrador:", erro);
                window.location.href = "artigos.html";
            }

        }
        verificarAdministrador();
    </script>
    <script>
        // Função para carregar os artigos pendentes
        async function carregarArtigosPendentes() {
            const token = localStorage.getItem("token");

            try {

                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/pendentes",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar artigos pendentes");
                }

                const artigos = await resposta.json();
                document.getElementById("contadorPendentes").textContent = artigos.length;
                const listaPendentes = document.getElementById("listaPendentes");

                listaPendentes.innerHTML = "";

                if (artigos.length === 0) {
                    listaPendentes.innerHTML = `
                        <div class="lista-vazia">
                            Não existem artigos pendentes.
                        </div>
                    `;
                    return;
                }

                artigos.forEach(function (artigo) {
                    const elemento = document.createElement("div");

                    elemento.classList.add("artigo-pendente");
                    elemento.innerHTML = `
                        <h2>${artigo.titulo}</h2>
                        <h3>
                            Autor: ${artigo.nome_autor}
                        </h3>
                        <p class="conteudo-preview">
                            ${
                                artigo.artigo.length > 50
                                    ? artigo.artigo.substring(0, 50) + "..."
                                    : artigo.artigo
                            }
                        </p>
                        <p class="data-artigo-admin">
                            Enviado em:
                            ${new Date(artigo.data_criacao).toLocaleDateString("pt-BR")}
                        </p>
                        <div class="acoes-artigo">
                            <button
                                class="btn-visualizar"
                                onclick="visualizarArtigo(${artigo.idart})">
                                VISUALIZAR
                            </button>
                            <button
                                class="btn-aprovar"
                                onclick="aprovarArtigo(${artigo.idart})">
                                APROVAR
                            </button>
                            <button
                                class="btn-rejeitar"
                                onclick="rejeitarArtigo(${artigo.idart})">
                                REJEITAR
                            </button>
                        </div>
                    `;
                    listaPendentes.appendChild(elemento);
                });

            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById("listaPendentes").innerHTML = `
                    <p>Não foi possível carregar os artigos pendentes.</p>
                `;
            }

        }

        // Função para carregar todos os artigos
        async function carregarTodosArtigos() {
            const token = localStorage.getItem("token");

            try {
                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar artigos");
                }

                const artigos = await resposta.json();
                const lista = document.getElementById("listaTodosArtigos");

                lista.innerHTML = "";

                if (artigos.length === 0) {
                    lista.innerHTML = `
                        <div class="lista-vazia">
                            Não existem artigos.
                        </div>
                    `;
                    return;
                }

                artigos.forEach(function (artigo) {
                    const elemento = document.createElement("div");

                    elemento.classList.add("artigo-pendente");

                    let classeStatus = "";

                    if (artigo.status === "aprovado") {
                        classeStatus = "status-aprovado";
                    } else if (artigo.status === "pendente") {
                        classeStatus = "status-pendente";
                    } else if (artigo.status === "rejeitado") {
                        classeStatus = "status-rejeitado";
                    }

                    elemento.innerHTML = `
                        <h2>${artigo.titulo}</h2>
                        <h3>Autor: ${artigo.nome_autor}</h3>

                        <p class="conteudo-preview">
                            ${
                                artigo.artigo.length > 50
                                    ? artigo.artigo.substring(0, 50) + "..."
                                    : artigo.artigo
                            }
                        </p>

                        <p class="data-artigo-admin">
                            Enviado em:
                            ${new Date(artigo.data_criacao).toLocaleDateString("pt-BR")}
                        </p>

                        <div class="acoes-artigo">
                            <span class="status-artigo ${classeStatus}">
                                ${artigo.status}
                            </span>
                            <button
                                class="btn-visualizar"
                                onclick="visualizarArtigo(${artigo.idart})">
                                VISUALIZAR
                            </button>
                            <button
                                class="btn-deletar"
                                onclick="deletarArtigoAdmin(${artigo.idart})">
                                DELETAR
                            </button>
                        </div>
                    `;
                    lista.appendChild(elemento);
                });
            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById("listaTodosArtigos").innerHTML = `
                    <div class="lista-vazia">
                        Não foi possível carregar os artigos.
                    </div>
                `;
            }
        }

        // Função para redirecionar para a página de visualização do artigo
        function visualizarArtigo(idart) {
            window.location.href = `artigo.html?id=${idart}`;
        }

        async function deletarArtigoAdmin(idart) {
            const confirmar = confirm(
                "Tem certeza que deseja excluir este artigo?"
            );

            if (!confirmar) {
                return;
            }

            const token = localStorage.getItem("token");

            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/deletar/${idart}`,
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(
                        resultado.detail ||
                        "Erro ao excluir artigo."
                    );

                    return;
                }

        alert("Artigo excluído com sucesso!");

        carregarTodosArtigos();
        carregarArtigosPendentes();

    } catch (erro) {
        console.error("Erro:", erro);
        alert(
            "Não foi possível conectar com o servidor."
        );
    }
}

        // Função para aprovar um artigo
        async function aprovarArtigo(idart) {
            const token = localStorage.getItem("token");

            const confirmar = confirm(
                "Tem certeza que deseja aprovar este artigo?"
            );

            if (!confirmar) {
                return;
            }

            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/aprovar/${idart}`,
                    {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.detail || "Erro ao aprovar artigo.");
                    return;
                }

                alert("Artigo aprovado com sucesso!");
                carregarArtigosPendentes();
            } catch (erro) {
                console.error("Erro:", erro);
                alert("Não foi possível conectar com o servidor.");
            }

        }

        // Função para rejeitar um artigo
        async function rejeitarArtigo(idart) {
            const token = localStorage.getItem("token");
            const confirmar = confirm(
                "Tem certeza que deseja rejeitar este artigo?"
            );

            if (!confirmar) {
                return;
            }

            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/rejeitar/${idart}`,
                    {
                        method: "PUT",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.detail || "Erro ao rejeitar artigo.");
                    return;
                }

                alert("Artigo rejeitado com sucesso!");
                carregarArtigosPendentes();
            } catch (erro) {
                console.error("Erro:", erro);
                alert("Não foi possível conectar com o servidor.");
            }

        }
        carregarArtigosPendentes();
        carregarTodosArtigos();
    </script>

</body>

</html>

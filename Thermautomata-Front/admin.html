<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <nav>

            <div class="row align-items-center">

                <div class="col-4">
                    <img src="assets/logo.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-5 align-items-center d-flex justify-content-center desktop-nav-links">
                  <a href="index.html" class="nav-link-custom">SOBRE</a>
                    <a href="artigos.html" class="nav-link-custom">ARTIGOS</a>
                    <a href="download.html" class="nav-link-custom">DOWNLOAD</a>
                </div>

                <div class="col-2 align-items-end justify-content-end d-flex" id="loginButtons">
                    <a href="login.html" class="nav-link-custom">LOGIN</a>

                    <button class="hamburger-btn"
                        id="hamburgerBtn"
                        aria-label="Abrir menu"
                        aria-expanded="false"
                        aria-controls="mobileNavPanel">

                        <span></span>
                        <span></span>
                        <span></span>

                    </button>

                </div>

            </div>

            <hr>

        </nav>
    </header>

    <!-- Overlay e painel do menu sanduíche -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="mobile-nav-panel"
        id="mobileNavPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Menu de navegação">

        <button class="close-btn"
            id="closeNavBtn"
            aria-label="Fechar menu">
            &times;
        </button>

        <a href="index.html">Sobre</a>
        <a href="artigos.html">Artigos</a>
        <a href="download.html">Download</a>
        <button class="login-btn-mobile">Login</button>
    </div>

    <!-- Área administrativa -->
    <main class="container mt-5" id="areaAdmin">

        <div class="admin-cabecalho">

            <div>
                <h1>Painel administrativo</h1>
                <p>
                    Gerencie os artigos enviados pelos usuários.
                </p>
            </div>

            <div class="admin-contador">
                <span id="contadorArtigos">0</span>
                <small id="textoContador">pendentes</small>
            </div>

        </div>

        <hr class="admin-divisor">

        <section>

            <div class="abas-artigos">

                <button class="aba-artigo ativa" data-status="pendente">
                    Artigos pendentes
                </button>

                <button class="aba-artigo" data-status="aprovado">
                    Artigos publicados
                </button>

                <button class="aba-artigo" data-status="rejeitado">
                    Artigos rejeitados
                </button>

            </div>

            <div id="listaArtigosAdmin">
                <p>Carregando artigos...</p>
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script type="module"
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js">
    </script>
    <script nomodule
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js">
    </script>
    <script>
        async function verificarAdministrador() {

            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {

                const resposta = await fetch(
                    "http://127.0.0.1:8000/auth/me",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }

                const usuario = await resposta.json();

                if (usuario.tipo !== 1) {
                    window.location.href = "artigos.html";
                    return;
                }

                document.getElementById("areaAdmin").style.display = "block";

            } catch (erro) {

                console.error("Erro ao verificar administrador:", erro);
                window.location.href = "artigos.html";

            }

        }

        verificarAdministrador();
    </script>
    <script>

        let statusAtual = "pendente";

        // =========================
        // CARREGAR ARTIGOS DO ADMIN
        // =========================

        async function carregarArtigosAdmin() {

            const token = localStorage.getItem("token");

            try {

                const resposta = await fetch(
                    "http://127.0.0.1:8000/artigos/",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar artigos");
                }

                const artigos = await resposta.json();

                // =========================
                // CONTADOR DE PENDENTES
                // =========================

                const quantidadeArtigos = artigos.filter(function (artigo) {
                    return artigo.status === statusAtual;
                }).length;

                document.getElementById("contadorArtigos").textContent =
                    quantidadeArtigos;


                const textoContador = document.getElementById("textoContador");

                if (statusAtual === "pendente") {
                    textoContador.textContent = "pendentes";
                }

                else if (statusAtual === "aprovado") {
                    textoContador.textContent = "publicados";
                }

                else if (statusAtual === "rejeitado") {
                    textoContador.textContent = "rejeitados";
                }

                // =========================
                // FILTRAR PELA ABA ATUAL
                // =========================

                const artigosFiltrados = artigos.filter(function (artigo) {
                    return artigo.status === statusAtual;
                });

                const lista = document.getElementById("listaArtigosAdmin");

                lista.innerHTML = "";

                // =========================
                // NENHUM ARTIGO
                // =========================

                if (artigosFiltrados.length === 0) {

                    let mensagem = "";

                    if (statusAtual === "pendente") {
                        mensagem = "Não existem artigos pendentes.";
                    }

                    else if (statusAtual === "aprovado") {
                        mensagem = "Não existem artigos publicados.";
                    }

                    else if (statusAtual === "rejeitado") {
                        mensagem = "Não existem artigos rejeitados.";
                    }

                    lista.innerHTML = `
                        <div class="lista-vazia">
                            ${mensagem}
                        </div>
                    `;

                    return;
                }

                // =========================
                // CRIAR CARDS
                // =========================

                artigosFiltrados.forEach(function (artigo) {

                    const elemento = document.createElement("div");

                    elemento.classList.add("artigo-pendente");

                    // Classe do status

                    let classeStatus = "";

                    if (artigo.status === "aprovado") {
                        classeStatus = "status-aprovado";
                    }

                    else if (artigo.status === "pendente") {
                        classeStatus = "status-pendente";
                    }

                    else if (artigo.status === "rejeitado") {
                        classeStatus = "status-rejeitado";
                    }

                    // Nome visual do status

                    let nomeStatus = "";

                    if (artigo.status === "aprovado") {
                        nomeStatus = "Publicado";
                    }

                    else if (artigo.status === "pendente") {
                        nomeStatus = "Pendente";
                    }

                    else if (artigo.status === "rejeitado") {
                        nomeStatus = "Rejeitado";
                    }

                    elemento.innerHTML = `

                        <h2>
                            ${artigo.titulo}
                        </h2>

                        <h3>
                            Autor: ${artigo.nome_autor}
                        </h3>

                        <p class="conteudo-preview">
                            ${
                                artigo.artigo.length > 50
                                    ? artigo.artigo.substring(0, 50) + "..."
                                    : artigo.artigo
                            }
                        </p>

                        <p class="data-artigo-admin">
                            Enviado em:
                            ${new Date(artigo.data_criacao).toLocaleDateString("pt-BR")}
                        </p>

                        <div class="acoes-artigo">

                            <span class="status-artigo ${classeStatus}">
                                ${nomeStatus}
                            </span>


                            <button
                                class="btn-visualizar"
                                onclick="visualizarArtigo(${artigo.idart})">
                                VISUALIZAR
                            </button>


                            ${
                                artigo.status === "pendente"
                                    ? `

                                        <button
                                            class="btn-aprovar"
                                            onclick="aprovarArtigo(${artigo.idart})">
                                            APROVAR
                                        </button>

                                        <button
                                            class="btn-rejeitar"
                                            onclick="rejeitarArtigo(${artigo.idart})">
                                            REJEITAR
                                        </button>

                                    `
                                    : ""
                            }


                            <button
                                class="btn-deletar"
                                onclick="deletarArtigoAdmin(${artigo.idart})">
                                DELETAR
                            </button>

                        </div>

                    `;

                    lista.appendChild(elemento);

                });


            } catch (erro) {

                console.error("Erro:", erro);

                document.getElementById("listaArtigosAdmin").innerHTML = `
                    <div class="lista-vazia">
                        Não foi possível carregar os artigos.
                    </div>
                `;

            }

        }

        // =========================
        // TROCAR DE ABA
        // =========================

        document.querySelectorAll(".aba-artigo").forEach(function (aba) {

            aba.addEventListener("click", function () {

                document.querySelectorAll(".aba-artigo").forEach(function (item) {
                    item.classList.remove("ativa");
                });


                aba.classList.add("ativa");


                statusAtual = aba.dataset.status;


                carregarArtigosAdmin();

            });

        });

        // =========================
        // VISUALIZAR ARTIGO
        // =========================

        function visualizarArtigo(idart) {

            window.location.href = `artigo.html?id=${idart}`;

        }

        // =========================
        // DELETAR ARTIGO
        // =========================

        async function deletarArtigoAdmin(idart) {

            const confirmar = confirm(
                "Tem certeza que deseja excluir este artigo?"
            );

            if (!confirmar) {
                return;
            }

            const token = localStorage.getItem("token");

            try {

                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/deletar/${idart}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {

                    mostrarNotificacao(
                        resultado.detail || "Erro ao excluir artigo.",
                        "erro"
                    );

                    return;
                }

                mostrarNotificacao(
                    "Artigo excluído com sucesso!"
                );

                carregarArtigosAdmin();

            } catch (erro) {
                console.error("Erro:", erro);
                mostrarNotificacao(
                    "Não foi possível conectar com o servidor.",
                    "erro"
                );
            }

        }

        // =========================
        // APROVAR ARTIGO
        // =========================

        async function aprovarArtigo(idart) {
            const token = localStorage.getItem("token");

            const confirmar = confirm(
                "Tem certeza que deseja aprovar este artigo?"
            );

            if (!confirmar) {
                return;
            }

            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/aprovar/${idart}`,
                    {
                        method: "PUT",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {

                    mostrarNotificacao(
                        resultado.detail || "Erro ao aprovar artigo.",
                        "erro"
                    );
                    return;
                }

                mostrarNotificacao(
                    "Artigo aprovado com sucesso!"
                );
                carregarArtigosAdmin();

            } catch (erro) {
                console.error("Erro:", erro);
                mostrarNotificacao(
                    "Não foi possível conectar com o servidor.",
                    "erro"
                );
            }

        }

        // =========================
        // REJEITAR ARTIGO
        // =========================

        async function rejeitarArtigo(idart) {
            const token = localStorage.getItem("token");

            const confirmar = confirm(
                "Tem certeza que deseja rejeitar este artigo?"
            );

            if (!confirmar) {
                return;
            }

            try {
                const resposta = await fetch(
                    `http://127.0.0.1:8000/artigos/rejeitar/${idart}`,
                    {
                        method: "PUT",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    mostrarNotificacao(
                        resultado.detail || "Erro ao rejeitar artigo.",
                        "erro"
                    );
                    return;
                }

                mostrarNotificacao(
                    "Artigo rejeitado com sucesso!"
                );
                carregarArtigosAdmin();

            } catch (erro) {
                console.error("Erro:", erro);
                mostrarNotificacao(
                    "Não foi possível conectar com o servidor.",
                    "erro"
                );
            }

        }

        // =========================
        // CARREGAR AO ABRIR A PÁGINA
        // =========================

        carregarArtigosAdmin();

    </script>
</body>

</html>
